data:
  dataset:
    name: pusht_expert_train
    val_name: pusht_expert_val
    keys_to_load:
    - pixels
    - action
    - proprio
    - state
    - block_ori
    - agent_xy
    - block_xy
    - agent_vel
    keys_to_cache:
    - action
    - proprio
    - state
    keys_to_merge:
      block_ori:
        key: block_ori
      agent_xy:
        key: state
        start: 0
        end: 2
      block_xy:
        key: state
        start: 2
        end: 4
      agent_vel:
        key: state
        start: 5
        end: 7
    level1:
      frameskip: 5
      num_steps: ${eval:'${level1.wm.history_size} + ${level1.wm.rollout_n}'}
    level2:
      frameskip: ${level2.stride}
      window_size: ${level2.window_size}
      num_steps: ${eval:'${level2.wm.history_size} + ${level2.wm.rollout_n}'}
quick_debug: false
training_protocol_version: 2
memory:
  encoder_checkpointing: true
  encoder_frame_chunk_size: 128
output_model_name: pusht_hjepa_l2
env: pusht
subdir: pusht/pusht_hjepa_l2/seed42_paper_v2_20261027
num_workers: 12
seed: 42
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: true
save_every_n_epochs: 1
resume_every_n_steps: 2000
trainer:
  max_epochs: 9
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  num_sanity_val_steps: 1
  accumulate_grad_batches: 1
  enable_progress_bar: false
loader:
  batch_size: 128
  num_workers: 6
  drop_last: true
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
wandb:
  enabled: false
  config:
    entity: null
    project: hjepa
    name: null
    id: null
    resume: allow
    log_model: false
planning_eval:
  enabled: true
  config_name: pusht_l2
  output_subdir: planning_eval
  run_on_train_end: true
  every_n_epochs: 0
final_probing_decoding_eval:
  enabled: true
  config_name: pusht
  output_subdir: final_probing_decoding_eval_v2
  overrides:
    level1:
      train_decoder: true
      probes:
        enabled: true
    level2:
      train_decoder: true
      probes:
        enabled: true
level1:
  lr: 5.0e-05
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 192
    use_proprio: false
    action_dim: 2
  encoder:
    type: vit
    scale: ${encoder_scale}
    projector:
      type: mlp
  predictor:
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.09
num_levels: 2
level2:
  lr: 1.0e-05
  stride: 2
  window_size: 1
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 192
    use_proprio: false
  encoder:
    type: latent_mlp
    input_dim: ${level1.wm.embed_dim}
    hidden_dim: 384
    final_ln: false
    output_dim: ${level2.wm.embed_dim}
    projector:
      type: identity
  action_encoder:
    output_dim: 4
    input_dim: ${level1.wm.embed_dim}
    max_chunk: ${eval:'${data.dataset.level2.frameskip} + 1'}
    queue_size: 4000
  action_embed:
    patch_embed: false
    input_dim: ${level2.action_encoder.output_dim}
  predictor:
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.09
