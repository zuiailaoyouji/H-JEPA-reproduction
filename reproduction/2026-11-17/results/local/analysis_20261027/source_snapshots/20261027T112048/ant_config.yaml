data:
  dataset:
    name: visual_antmaze_medium_explore_stitch_train
    subset_seed: ${seed}
    val_name: visual_antmaze_medium_stitch_val
    val_total_transitions: 201000
    keys_to_load:
    - pixels
    - action
    - xy
    - qpos
    - qvel
    - proprio
    keys_to_cache:
    - action
    - xy
    - qpos
    - qvel
    keys_to_merge:
      proprio:
      - key: qpos
        start: 2
      - qvel
    level1:
      frameskip: 5
      num_steps: ${eval:'${level1.wm.history_size} + ${level1.wm.rollout_n}'}
    level2:
      frameskip: ${level2.stride}
      window_size: ${level2.window_size}
      num_steps: ${eval:'${level2.wm.history_size} + ${level2.wm.rollout_n}'}
output_model_name: ant_hjepa_l2
env: ant
subdir: ant/ant_hjepa_l2/seed42_paper_v2_20261027
quick_debug: false
training_protocol_version: 2
memory:
  encoder_checkpointing: true
  encoder_frame_chunk_size: 128
num_workers: 6
seed: 42
img_size: 64
patch_size: 4
encoder_scale: tiny
dump_object: true
save_every_n_epochs: 1
resume_every_n_steps: 2000
trainer:
  max_epochs: 5
  devices: 1
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  num_sanity_val_steps: 1
  accumulate_grad_batches: 1
  enable_progress_bar: false
loader:
  batch_size: 128
  num_workers: 6
  drop_last: true
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true
  shuffle: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
wandb:
  enabled: false
  config:
    entity: null
    project: hjepa
    name: null
    id: null
    resume: allow
    log_model: false
planning_eval:
  enabled: true
  config_name: ant_l2
  output_subdir: planning_eval
  run_on_train_end: true
  every_n_epochs: 0
final_probing_decoding_eval:
  enabled: true
  config_name: ant
  output_subdir: final_probing_decoding_eval_v2
  overrides:
    level1:
      train_decoder: true
      probes:
        enabled: true
    level2:
      train_decoder: true
      probes:
        enabled: true
level1:
  lr: 5.0e-05
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 384
    use_proprio: true
    proprio_emb_dim: 128
    action_dim: 8
    proprio_dim: 27
  encoder:
    projector:
      type: identity
    pixel_encoder:
      encoder:
        type: vit
        scale: tiny
      projector:
        type: mlp
        output_dim: 256
    proprio_encoder:
      encoder:
        type: mlp
        hidden_dim: 256
        output_dim: ${level1.wm.proprio_emb_dim}
      projector:
        type: identity
  predictor:
    depth: 4
    heads: 8
    mlp_dim: 1024
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 192
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.09
num_levels: 2
level2:
  lr: 1.0e-05
  stride: 2
  window_size: 1
  wm:
    history_size: 3
    rollout_n: 1
    rollout_loss_weight: 1.0
    embed_dim: 384
    use_proprio: false
  encoder:
    type: latent_mlp
    input_dim: ${level1.wm.embed_dim}
    hidden_dim: 384
    final_ln: false
    output_dim: ${level2.wm.embed_dim}
    projector:
      type: identity
  action_encoder:
    output_dim: 4
    input_dim: ${level1.wm.embed_dim}
    max_chunk: ${eval:'${data.dataset.level2.frameskip} + 1'}
    queue_size: 4000
  action_embed:
    patch_embed: false
    input_dim: ${level2.action_encoder.output_dim}
  predictor:
    depth: 5
    heads: 12
    mlp_dim: 1536
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
    hidden_dim: 224
    projector:
      type: mlp
  loss:
    embed:
      sigreg:
        enabled: true
        weight: 0.09
